# =============================================================================
# PACCA CI Pipeline
# Runs on every push and pull request
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly clinical-gate run for main (11:00 UTC). Other jobs are cheap.
    - cron: "0 11 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Lint and Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned to match .pre-commit-config.yaml exactly. Unpinned installs
          # here previously pulled a newer ruff (0.16.0) that enforced new rules
          # tree-wide and broke lint on every PR while pre-commit (older, pinned)
          # stayed green — the divergence the pre-commit comment warns about.
          # Bump both together when upgrading.
          pip install ruff==0.15.12 mypy==1.13.0

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

      - name: Run MyPy type checker
        run: mypy src/pacca --ignore-missing-imports
        continue-on-error: true  # Type errors are warnings for now

  # ---------------------------------------------------------------------------
  # Deterministic tests — the WHOLE non-billable suite.
  #
  # This job previously ran only `pytest tests/unit`, so tests/harness and
  # tests/integration were never executed in CI and tests/test_level5_flow.py's
  # collection errors stayed invisible: the badge could be green while
  # `make test-all` was red locally. The scope here now matches `make test-all`
  # exactly (`pytest tests/ -m "not clinical and not holdout"`), which is what makes that
  # divergence impossible. Live-LLM tests carry the `clinical` marker and are
  # deselected here — they run in the separate, opt-in clinical-gate job.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Same scope as `make test-all`. No -x: a full failure list is more useful
      # than the first one, and the job fails either way.
      - name: Run the full non-clinical test suite (make test-all)
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-placeholder"
          APP_ENV: "development"
          DEBUG: "true"
        run: |
          pytest tests/ -m "not clinical and not holdout" --tb=short

      - name: Run tests with coverage
        env:
          ANTHROPIC_API_KEY: "sk-ant-test-placeholder"
          APP_ENV: "development"
          DEBUG: "true"
        run: |
          pytest tests/ -m "not clinical and not holdout" --cov=pacca --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Build Docker Image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pacca:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security linter
        run: bandit -r src/pacca -ll
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -e .
          safety check
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Manifest validation (P-6) — every behavioral change ships a valid manifest
  # ---------------------------------------------------------------------------
  validate-manifests:
    name: Validate change manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate all manifests against the schema
        run: python -m pacca.harness.validate_manifest --all

  # ---------------------------------------------------------------------------
  # Clinical gate (P-6) — GC-018/019 + golden-set accuracy. Real Anthropic
  # calls, so it runs only when it matters: the nightly schedule, or a PR that
  # touches agent/rag code or carries a chg- commit. Opt-in by secret (inert
  # until ANTHROPIC_API_KEY is set), so it never blocks doc-only PRs.
  # ---------------------------------------------------------------------------
  clinical-gate:
    name: Clinical gate (GC-018/019 + accuracy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # The base must come from the event, because the two events carry it in
          # different places. A pull_request has base.sha; a push has `before`, the
          # sha main pointed at BEFORE this push landed.
          #
          # The old code was `base="${BASE_SHA:-origin/main}"`, and that fallback was
          # silently fatal on a push. BASE_SHA is empty on a push, so base became the
          # literal ref origin/main -- which, after actions/checkout of a push to main,
          # IS HEAD. Diffing HEAD against itself is empty by construction, so the gate
          # answered "skip" for every push to main no matter what it contained, and a
          # skipped required check reports SUCCESS. Observed 2026-07-29 on run
          # 30470889996: a push carrying chg-19 through chg-25 went green ungated.
          case "$EVENT_NAME" in
            pull_request*) base="$BASE_SHA" ;;
            push)          base="$PUSH_BEFORE_SHA" ;;
            *)             base="" ;;
          esac

          # Fail OPEN. Branch creation sends an all-zero `before`; a force-push can
          # send a sha that no longer exists. Either way the pushed range is
          # uncomputable, so we cannot show the change is harmless -- and an
          # unprovable change gets gated, not waved through. Preferring the cheap
          # answer to the safe one is the bug above, and it is worth stating as a
          # rule: an undecidable base runs the gate.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::clinical-gate: base '${base:-unset}' is unresolvable — running rather than skipping"
            exit 0
          fi

          # Commit subjects and file names are only piped to grep, never executed.
          if git diff --name-only "$base"...HEAD | grep -qE '^src/pacca/(agents|rag)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::clinical-gate: change touches agent/rag code"; exit 0
          fi
          # The pinned model identifier lives in config/settings.py, which is not under
          # agents/ or rag/. Editing it changes every agent call's substrate while
          # matching none of the filters above -- the exact hole the iter-14 model
          # substitution went through (docs/DECISIONS.md). Gate on it explicitly.
          if git diff --name-only "$base"...HEAD | grep -qE '^src/pacca/config/settings\.py$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::clinical-gate: change touches the pinned model identifier"; exit 0
          fi
          if git log --format='%s' "$base"...HEAD | grep -qE '^chg-'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::clinical-gate: change carries a chg- (behavioral) commit"; exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::clinical-gate skipped — no agent/rag change or chg- commit in ${base}...HEAD"

      - name: Check for API key (opt-in by secret)
        id: key
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — clinical-gate is inert until it is added"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true' && steps.key.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' && steps.key.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run clinical gate (GC-018/019 + accuracy threshold)
        if: steps.gate.outputs.run == 'true' && steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-clinical

  # ---------------------------------------------------------------------------
  # Held-out (out-of-sample) accuracy report — SCHEDULE / MANUAL ONLY
  #
  # Deliberately NOT a pull_request job, and deliberately not part of
  # clinical-gate. Two reasons, the second being the important one:
  #
  #   1. It is not a gate. Its only assertion is a wiring check, so on a PR it
  #      would spend ~7.5 min of live API calls (measured 2026-07-28) and could
  #      never block a merge.
  #   2. Running a holdout on every behavioural PR destroys it. The job output
  #      names the failing held-out cases; the natural response is to tune a
  #      prompt until they pass, which contaminates the holdout through the one
  #      channel tests/unit/test_eval_holdout_guard.py cannot see — a human
  #      reading CI logs. A holdout is only worth what its isolation is worth.
  #
  # Reports a number on a cadence; never blocks. See docs/EVALUATION.md.
  # ---------------------------------------------------------------------------
  holdout-report:
    name: Held-out accuracy report (out-of-sample, non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for API key (opt-in by secret)
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — holdout report is inert until it is added"
          fi

      - name: Set up Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # continue-on-error: this reports, it does not gate. A dip in the
      # out-of-sample number is information to act on deliberately, not a red
      # build — promoting it to blocking is the warn->enforce decision
      # documented in docs/EVALUATION.md, taken by a human, not inherited here.
      - name: Run held-out accuracy report
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-holdout

  test-postgres:
    name: Postgres integration (SQLite-masked bugs — B2/B3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The test fixture runs `alembic upgrade head` against POSTGRES_TEST_URL,
      # so the schema is migration-built (production-shaped), not create_all.
      # No ANTHROPIC_API_KEY needed — the LLM/RAG are patched; this job verifies
      # persistence + referential integrity, which SQLite structurally cannot.
      - name: Run Postgres integration tests
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://t:t@localhost:5432/t
        run: pytest tests/integration -m postgres -v

  # ---------------------------------------------------------------------------
  # Migration drift guard (C5) — Alembic is the single source of truth for the
  # schema. On a fresh Postgres: apply every migration, then assert
  # `alembic revision --autogenerate` produces an EMPTY diff (the models and
  # the migrations agree on every table, including `users` — see migration
  # 004). Also proves the full migration chain downgrades and re-upgrades
  # cleanly. Fails the job (not just a warning) if models and migrations
  # diverge, or if any migration doesn't roundtrip.
  # ---------------------------------------------------------------------------
  migration-drift:
    name: Migration drift guard (models == migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://t:t@localhost:5432/t
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: alembic upgrade head
        run: alembic upgrade head

      - name: Assert autogenerate produces no drift
        run: |
          set -o pipefail
          output="$(alembic revision --autogenerate -m "ci-drift-check" 2>&1)"
          echo "$output"
          # Parse the generated path from Alembic's own "Generating <path> ..."
          # line — independent of git status, so it works whether or not the
          # working tree already has untracked files.
          generated="$(echo "$output" | sed -n 's/^Generating \(.*\) \.\.\..*/\1/p')"
          if [ -z "$generated" ] || [ ! -f "$generated" ]; then
            echo "::error::could not locate the autogenerated migration file — cannot verify drift"
            exit 1
          fi
          # An empty migration's upgrade()/downgrade() bodies are each a lone
          # 'pass' (plus the auto-generated comment lines Alembic always
          # emits). Any other op.* call means models and migrations disagree.
          if grep -qE '^\s+op\.' "$generated"; then
            echo "::error::alembic autogenerate detected schema drift between the ORM models and the migrations — add a migration for the change below:"
            cat "$generated"
            rm -f "$generated"
            exit 1
          fi
          echo "No drift detected — models and migrations agree."
          rm -f "$generated"

      - name: Roundtrip — downgrade to base, then upgrade to head
        run: |
          alembic downgrade base
          alembic upgrade head
